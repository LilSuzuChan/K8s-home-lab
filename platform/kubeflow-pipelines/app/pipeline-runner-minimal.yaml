apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner-minimal
  labels:
    app.kubernetes.io/part-of: kubeflow-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-runner-minimal
  labels:
    app.kubernetes.io/part-of: kubeflow-pipelines
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - mlpipeline-minio-artifact
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - kfp-launcher
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
  - apiGroups:
      - argoproj.io
    resources:
      - workflows
    verbs:
      - get
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner-minimal
  labels:
    app.kubernetes.io/part-of: kubeflow-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-runner-minimal
subjects:
  - kind: ServiceAccount
    name: pipeline-runner-minimal
    namespace: kubeflow
