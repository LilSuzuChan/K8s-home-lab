apiVersion: v1
kind: ConfigMap
metadata:
  name: kfp-launcher
  namespace: kubeflow
data:
  defaultPipelineRoot: minio://mlpipeline/v2/artifacts
  providers: |
    minio:
      default:
        endpoint: seaweedfs.object-storage.svc.cluster.local:8333
        region: us-east-1
        disableSSL: true
        forcePathStyle: true
        credentials:
          fromEnv: false
          secretRef:
            secretName: mlpipeline-minio-artifact
            accessKeyKey: accesskey
            secretKeyKey: secretkey
