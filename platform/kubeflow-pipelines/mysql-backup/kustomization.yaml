apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubeflow

labels:
  - pairs:
      app.kubernetes.io/part-of: kubeflow-pipelines
      app.kubernetes.io/component: mysql-backup

resources:
  - serviceaccount.yaml
  - cronjob.yaml

configMapGenerator:
  - name: kfp-mysql-backup-scripts
    files:
      - dump.sh
      - upload.sh
