apiVersion: batch/v1
kind: CronJob
metadata:
  name: kfp-mysql-backup
  labels:
    app.kubernetes.io/name: kfp-mysql-backup
spec:
  schedule: "30 2 * * *"
  timeZone: Asia/Tokyo
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: kfp-mysql-backup
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kfp-mysql-backup
        spec:
          serviceAccountName: kfp-mysql-backup
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            fsGroup: 1009
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              image: docker.io/library/mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
              command:
                - /bin/bash
                - /scripts/dump.sh
              env:
                - name: MYSQL_HOST
                  value: mysql.kubeflow.svc.cluster.local
                - name: MYSQL_PORT
                  value: "3306"
                - name: DATABASES
                  value: mlpipeline metadb
                - name: MYSQL_BACKUP_USER
                  valueFrom:
                    secretKeyRef:
                      name: kfp-mysql-backup
                      key: username
                - name: MYSQL_BACKUP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: kfp-mysql-backup
                      key: password
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                runAsUser: 999
                runAsGroup: 999
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: tmp-dump
                  mountPath: /tmp
          containers:
            - name: upload
              image: docker.io/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
              command:
                - /bin/sh
                - /scripts/upload.sh
              env:
                - name: HOME
                  value: /tmp
                - name: XDG_CONFIG_HOME
                  value: /tmp
                - name: BACKUP_BUCKET
                  value: kfp-db-backup
                - name: RETENTION_DAYS
                  value: "30"
                - name: KEEP_MIN
                  value: "7"
                - name: RCLONE_CONFIG_SEAWEEDFS_TYPE
                  value: s3
                - name: RCLONE_CONFIG_SEAWEEDFS_PROVIDER
                  value: SeaweedFS
                - name: RCLONE_CONFIG_SEAWEEDFS_ENDPOINT
                  value: http://seaweedfs.object-storage.svc.cluster.local:8333
                - name: RCLONE_CONFIG_SEAWEEDFS_REGION
                  value: us-east-1
                - name: RCLONE_CONFIG_SEAWEEDFS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: kfp-db-backup-s3
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_SEAWEEDFS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: kfp-db-backup-s3
                      key: AWS_SECRET_ACCESS_KEY
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                runAsUser: 1009
                runAsGroup: 1009
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp-upload
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: kfp-mysql-backup-scripts
                defaultMode: 0555
            - name: work
              emptyDir:
                sizeLimit: 1Gi
            - name: tmp-dump
              emptyDir:
                sizeLimit: 64Mi
            - name: tmp-upload
              emptyDir:
                sizeLimit: 64Mi
