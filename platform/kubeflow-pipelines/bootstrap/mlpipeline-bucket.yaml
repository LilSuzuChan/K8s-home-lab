apiVersion: batch/v1
kind: Job
metadata:
  name: kfp-mlpipeline-bucket
  namespace: object-storage
  labels:
    app.kubernetes.io/part-of: kubeflow-pipelines
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: kubeflow-pipelines
        object-storage.homelab/s3-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-bucket
          image: docker.io/amazon/aws-cli:2.38.1@sha256:733d5be1015825e4038c6016f3fa9954868ddee1f611b73be795a9cc2e706bfd
          command:
            - /bin/sh
            - -ec
            - |
              if aws s3api head-bucket --bucket mlpipeline 2>/dev/null; then
                echo "bucket mlpipeline already exists"
              else
                aws s3api create-bucket --bucket mlpipeline >/dev/null
                echo "created bucket mlpipeline"
              fi
              aws s3api head-bucket --bucket mlpipeline
              echo PASS
          env:
            - name: HOME
              value: /tmp
            - name: AWS_ENDPOINT_URL
              value: http://seaweedfs.object-storage.svc.cluster.local:8333
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_PAGER
              value: ""
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
