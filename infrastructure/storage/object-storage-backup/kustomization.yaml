apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: object-storage-backup

labels:
  - pairs:
      app.kubernetes.io/part-of: object-storage-backup

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - cronjob.yaml

configMapGenerator:
  - name: seaweedfs-backup-scripts
    files:
      - backup.sh
