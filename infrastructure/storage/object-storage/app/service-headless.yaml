apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-headless
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
      protocol: TCP
      appProtocol: http
