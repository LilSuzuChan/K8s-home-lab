apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: object-storage

labels:
  - pairs:
      app.kubernetes.io/part-of: object-storage

resources:
  - serviceaccount.yaml
  - networkpolicy.yaml
  - service.yaml
  - service-headless.yaml
  - statefulset.yaml

configMapGenerator:
  - name: seaweedfs-scripts
    files:
      - start.sh
      - ready.sh
