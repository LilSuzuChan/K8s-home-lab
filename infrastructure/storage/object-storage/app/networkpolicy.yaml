apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              object-storage.homelab/s3-client: "true"
        - namespaceSelector:
            matchLabels:
              object-storage.homelab/s3-client: "true"
      ports:
        - port: 8333
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
